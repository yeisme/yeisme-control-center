name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install media fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: App shell browser checks
        run: bun run test:ci:browser
      - name: Task observation contract checks
        run: bun run test:task-visibility
      - name: Public surface scan
        run: bun run check:public-surface
      - name: Release manifest and SBOM
        run: bun run release:manifest
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-ci-evidence
          if-no-files-found: warn
          path: |
            temp/integration-test-runs/**
            temp/delivery/**
            dist/**
