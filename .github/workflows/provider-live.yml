name: Provider live canary

# Real, paid Provider calls: one modality per run, budgets in USD (the currency owners cap a run in), a new label for every
# attempt. Inputs reach the script through environment variables, never through the shell text of a step.
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Confirm real Provider calls and the declared budget
        required: true
        default: false
        type: boolean
      modality:
        description: Which Provider to call (image is Eikona, video is Scaena, audio is Sonora)
        required: true
        type: choice
        options:
          - audio
          - image
          - video
      run_label:
        description: New label for this attempt, 4 to 40 lowercase letters, digits or hyphens. A label that already ran only reconciles that run.
        required: true
        type: string
      total_usd:
        description: Total budget in USD
        required: true
        default: '0.5'
        type: string
      image_usd:
        description: Eikona budget in USD (needed when modality is image)
        required: false
        default: '0'
        type: string
      video_usd:
        description: Scaena budget in USD (needed when modality is video)
        required: false
        default: '0'
        type: string
      audio_usd:
        description: Sonora budget in USD (needed when modality is audio)
        required: false
        default: '0.5'
        type: string

permissions:
  contents: read

jobs:
  canary:
    if: inputs.confirm_live == true
    environment: provider-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANARY_MODALITY: ${{ inputs.modality }}
      CANARY_RUN_LABEL: ${{ inputs.run_label }}
      CANARY_TOTAL_USD: ${{ inputs.total_usd }}
      CANARY_IMAGE_USD: ${{ inputs.image_usd }}
      CANARY_VIDEO_USD: ${{ inputs.video_usd }}
      CANARY_AUDIO_USD: ${{ inputs.audio_usd }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check the declared budget (no calls, no secrets)
        run: |
          bun run test:provider-live -- --dry-run --modality "$CANARY_MODALITY" --run-label "$CANARY_RUN_LABEL" --total-usd "$CANARY_TOTAL_USD" --image-usd "$CANARY_IMAGE_USD" --video-usd "$CANARY_VIDEO_USD" --audio-usd "$CANARY_AUDIO_USD"
      - name: Write ephemeral login file
        env:
          CONTROL_CENTER_LOGIN_JSON: ${{ secrets.CONTROL_CENTER_LOGIN_JSON }}
        run: |
          test -n "$CONTROL_CENTER_LOGIN_JSON"
          umask 077
          printf '%s' "$CONTROL_CENTER_LOGIN_JSON" > "$RUNNER_TEMP/control-center-login.json"
      - name: Run explicitly confirmed canary
        env:
          YEISME_CONTROL_ORIGIN: ${{ secrets.YEISME_CONTROL_ORIGIN }}
          YEISME_CONTROL_LOGIN_FILE: ${{ runner.temp }}/control-center-login.json
        run: |
          test -n "$YEISME_CONTROL_ORIGIN"
          bun run test:provider-live -- --confirm-live --modality "$CANARY_MODALITY" --run-label "$CANARY_RUN_LABEL" --total-usd "$CANARY_TOTAL_USD" --image-usd "$CANARY_IMAGE_USD" --video-usd "$CANARY_VIDEO_USD" --audio-usd "$CANARY_AUDIO_USD"
      - name: Upload redacted canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-live-evidence
          if-no-files-found: warn
          path: temp/integration-test-runs/provider-live-*/**
