name: Owner compatibility

on:
  workflow_dispatch:
    inputs:
      run_external_owners:
        description: Run tests against a prepared multi-repository workspace
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  owners:
    if: inputs.run_external_owners == true
    runs-on: [self-hosted, yeisme-owner-workspace]
    timeout-minutes: 30
    steps:
      - name: Checkout control center
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify prepared owner workspace
        run: |
          test -d ../../apigateway/aigora
          test -d ../../agent/scaena
          test -d ../../cli/eikona
          test -d ../../cli/sonora
      - name: Run owner compatibility tests
        run: bun run test:owners
      - name: Upload owner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-compatibility-evidence
          if-no-files-found: warn
          path: |
            temp/integration-test-runs/**
            temp/delivery/**
