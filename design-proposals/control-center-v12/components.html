<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yeisme v12 · 组件样板</title><link rel="icon" href="data:,"><link rel="stylesheet" href="resources/workspace.css"><link rel="stylesheet" href="resources/product.css"><link rel="stylesheet" href="resources/atelier.css"><style>.sample{max-width:1080px;padding:32px;margin:auto}.sample-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.sample .panel{padding:24px}.sample h1{font-size:32px}.sample h2{font-size:20px;margin-bottom:20px}.sample p{color:var(--ui-muted);margin:12px 0 24px}.sample header{display:flex;justify-content:space-between;gap:24px;margin-bottom:32px}.sample fieldset{border:0;padding:0;display:grid;gap:12px}.sample input{width:100%;min-height:44px;border:1px solid var(--ui-line);background:var(--ui-fill);padding:12px;border-radius:8px}.sample .badge{margin:4px}.sample .row{flex-wrap:wrap}.sample a{color:var(--ui-text)}@media(max-width:700px){.sample{padding:24px 16px}.sample-grid{grid-template-columns:1fr}.sample header{flex-direction:column}}</style></head>
<body><main class="sample"><header><div><span class="eyebrow">YEISME / DESIGN SYSTEM 12</span><h1>同一套组件，两种工作氛围。</h1><p>编辑室 · 电影工作台</p></div><button class="primary" id="theme">切换主题</button></header><div class="sample-grid">
<section class="panel"><h2>动作层级</h2><div class="row"><button class="primary">继续镜头 03</button><button class="btn">查看原任务</button><button class="ghost">返回项目</button><button class="btn" disabled>写入未接入</button></div><p>一个主操作，辅助动作保持克制；禁用必须有原因。</p></section>
<section class="panel"><h2>状态独立于品牌</h2><span class="badge good">已完成</span><span class="badge warn">结果待决</span><span class="badge bad">权利阻塞</span><span class="badge">未提供</span><p>颜色与文字共同表达状态，绿色连接不推导业务可继续。</p></section>
<section class="panel"><h2>输入与边界</h2><fieldset><label for="name">连接显示名称</label><input id="name" value="Sonora · 项目观察"><small>仅演示输入。切换主题保留内容，不发送数据。</small></fieldset></section>
<section class="panel"><h2>信息层级</h2><div class="row between"><b>Sonora</b><span class="status"><i class="dot"></i>样例连接正常</span></div><p>声音任务与权利 · 内容逐结果授权</p><details class="technical"><summary>详细信息</summary><p>任务族、固定引用、观察时间与合同依据在这里展开。</p></details></section>
</div><p><a href="index.html">返回完整原型 →</a></p></main><script>document.getElementById('theme').addEventListener('click',()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';});</script></body></html>
