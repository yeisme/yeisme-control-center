<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片场入口 · 集成审阅</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#222329;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header,main{max-width:1280px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e4e8}header a,a.button{color:inherit;text-decoration:none;border:1px solid #dddde4;background:white;border-radius:7px;padding:8px 12px;font-size:14px}h1{font-size:26px;margin:0 0 9px}p{margin:6px 0;color:#727480}.note{padding:15px 18px;border:1px solid #e7decf;background:#faf4e9;border-radius:9px;color:#815e26;margin:24px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0 16px}button{font:inherit;font-size:14px;border:1px solid #e4e4e8;background:white;color:inherit;border-radius:7px;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#222329;color:white;border-color:#222329}button:focus-visible,a:focus-visible{outline:2px solid #8775b5;outline-offset:3px}figure{margin:0;border:1px solid #e4e4e8;background:white;border-radius:10px;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:15px 20px;color:#727480;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}footer{font-size:12px;color:#727480;margin:30px 0}@media(max-width:600px){header,main{padding:20px}header{gap:10px}h1{font-size:22px}}
</style></head><body><header><strong>Yeisme 控制中心 · 集成审阅</strong><a href="./index.html">打开控制中心 ↗</a></header><main><h1>让服务管理回到创作现场</h1><p>三个入口已经在片场副本中实现并通过浏览器验证。下方展示实际实现截图。</p><div class="note">片场主原型存在另一项活动写入。本交付保留其远端入口；此处是已验证的集成审阅与源码补丁，不表示主原型已经更新。</div><div class="tabs" aria-label="选择集成截图"><button data-view="tasks" aria-pressed="true">导航与任务诊断</button><button data-view="services" aria-pressed="false">当前项目服务状态</button><button data-view="diagnostic" aria-pressed="false">保留原任务上下文</button></div><figure><img id="preview" src="./review/frame-tasks.png" alt="片场任务页面：导航底部的控制中心、顶栏服务状态与失败任务诊断链接"><figcaption id="caption">保持现有创作导航，仅增加管理入口。失败任务通过原项目、镜头与任务引用打开控制中心。</figcaption></figure><div class="actions"><a class="button" href="./frame-integration.patch" download>下载片场入口源码补丁</a><a class="button" href="./docs/verification.md">查看验证记录</a><a class="button" href="./docs/interfaces.md">查看接口交接</a></div><footer>使用临时浏览器中的演示项目验证。无真实服务写入、生成或凭据操作。原剧本文字与分镜描述在新标签往返后保留。</footer></main><script>
const views={tasks:{image:'frame-tasks.png',alt:'片场导航与任务诊断入口',text:'保持现有创作导航，仅增加管理入口。失败任务通过原项目、镜头与任务引用打开控制中心。'},services:{image:'frame-services.png',alt:'片场当前项目服务状态面板',text:'服务状态明确显示客户端待接线，区分远程 MCP 可用与片场已接入。查看各服务时保留原创作位置。'},diagnostic:{image:'frame-diagnostic.png',alt:'控制中心接收片场原任务上下文',text:'接收原项目、任务与镜头，未知映射保持等待正式接线，不自动匹配同名任务或创建生成请求。'}};
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{const view=views[button.dataset.view];document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const image=document.getElementById('preview');image.src='./review/'+view.image;image.alt=view.alt;document.getElementById('caption').textContent=view.text}));
</script></body></html>
